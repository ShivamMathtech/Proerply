services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proerply
      POSTGRES_USER: proerply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proerply -d proerply"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://proerply:${POSTGRES_PASSWORD}@db:5432/proerply
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_USERS: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-DemoPass123!}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
